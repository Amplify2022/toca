<!doctype html>
<html lang="es-UY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14190f">
  <meta name="robots" content="noindex,nofollow">
  <title>Tus tokens · TOCÁ · Prototipo</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=1">
  <script src="app.js?v=1" defer></script>
</head>
<body>
  <aside class="prototype-bar" aria-label="Controles del prototipo">
    <div><span class="prototype-label">PROTOTIPO J + H</span><span class="prototype-caption">Sin cobros ni pedidos reales</span></div>
    <details class="prototype-tools">
      <summary>Probar estados</summary>
      <div class="prototype-menu">
        <strong>Datos de esta pestaña</strong>
        <p>Estos controles solo modifican el prototipo.</p>
        <button type="button" data-scenario="empty">Probar sin tokens</button>
        <button type="button" data-scenario="initial">Reiniciar con 3 tokens</button>
        <label><input type="checkbox" id="fail-next"> Fallar el próximo pedido</label>
      </div>
    </details>
  </aside>
  <div class="app-shell">
    <header class="topbar" id="topbar"></header>
    <main id="view" class="view"></main>
    <nav id="navigation" class="bottom-nav" aria-label="Navegación principal"></nav>
  </div>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div id="sheet-content"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
